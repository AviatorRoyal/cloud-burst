# Sample institutional app: three services, one per data class.
# Plain python:3.12-slim image + script from a ConfigMap, so no image build or registry is needed.
apiVersion: v1
kind: Namespace
metadata: { name: p11-app }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: p11-server, namespace: p11-app }
data:
  server.py: |
    import json, os, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    WORK_MS = float(os.environ.get("WORK_MS", "15"))
    NODE = os.environ.get("NODE_NAME", "?")
    SVC = os.environ.get("SERVICE", "?")
    def spin(n):
        x = 0
        for i in range(n):
            x += i * i
        return x
    # Fixed CPU work per request: calibrate iterations per ms on CPU time (not wall time),
    # so CFS throttling slows requests down instead of silently shrinking the work.
    rates = []
    for _ in range(5):
        c0 = time.process_time(); spin(200000); rates.append(200000 / max(1e-6, (time.process_time() - c0) * 1000))
    ITERS = int(max(rates) * WORK_MS)
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                body = b"ok"
            else:
                spin(ITERS)
                body = json.dumps({"service": SVC, "node": NODE}).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *a):
            pass
    ThreadingHTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: records
  namespace: p11-app
  labels: { app: records, p11.burst/managed: "true", p11.burst/data-class: restricted }
spec:
  replicas: 1
  selector: { matchLabels: { app: records } }
  template:
    metadata: { labels: { app: records, p11.burst/managed: "true" } }
    spec:
      containers:
        - name: server
          image: python:3.12-slim
          command: ["python", "/app/server.py"]
          env:
            - { name: SERVICE, value: records }
            - { name: WORK_MS, value: "15" }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 2 }
          resources: { requests: { cpu: 250m, memory: 64Mi }, limits: { cpu: 500m, memory: 128Mi } }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes: [{ name: app, configMap: { name: p11-server } }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms
  namespace: p11-app
  labels: { app: lms, p11.burst/managed: "true", p11.burst/data-class: internal }
spec:
  replicas: 1
  selector: { matchLabels: { app: lms } }
  template:
    metadata: { labels: { app: lms, p11.burst/managed: "true" } }
    spec:
      containers:
        - name: server
          image: python:3.12-slim
          command: ["python", "/app/server.py"]
          env:
            - { name: SERVICE, value: lms }
            - { name: WORK_MS, value: "15" }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 2 }
          resources: { requests: { cpu: 250m, memory: 64Mi }, limits: { cpu: 500m, memory: 128Mi } }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes: [{ name: app, configMap: { name: p11-server } }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static
  namespace: p11-app
  labels: { app: static, p11.burst/managed: "true", p11.burst/data-class: public }
spec:
  replicas: 1
  selector: { matchLabels: { app: static } }
  template:
    metadata: { labels: { app: static, p11.burst/managed: "true" } }
    spec:
      containers:
        - name: server
          image: python:3.12-slim
          command: ["python", "/app/server.py"]
          env:
            - { name: SERVICE, value: static }
            - { name: WORK_MS, value: "15" }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 2 }
          resources: { requests: { cpu: 250m, memory: 64Mi }, limits: { cpu: 500m, memory: 128Mi } }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes: [{ name: app, configMap: { name: p11-server } }]
---
apiVersion: v1
kind: Service
metadata: { name: records, namespace: p11-app }
spec: { type: NodePort, selector: { app: records }, ports: [{ port: 80, targetPort: 8080, nodePort: 30081 }] }
---
apiVersion: v1
kind: Service
metadata: { name: lms, namespace: p11-app }
spec: { type: NodePort, selector: { app: lms }, ports: [{ port: 80, targetPort: 8080, nodePort: 30082 }] }
---
apiVersion: v1
kind: Service
metadata: { name: static, namespace: p11-app }
spec: { type: NodePort, selector: { app: static }, ports: [{ port: 80, targetPort: 8080, nodePort: 30083 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: records, namespace: p11-app }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: records }
  minReplicas: 1
  maxReplicas: 30
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } } }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: lms, namespace: p11-app }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: lms }
  minReplicas: 1
  maxReplicas: 30
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } } }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: static, namespace: p11-app }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: static }
  minReplicas: 1
  maxReplicas: 30
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } } }]
