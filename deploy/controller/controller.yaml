# In-cluster deployment of PolicyBurst. The source is shipped as a ConfigMap built by
#   kubectl -n kube-system create configmap policyburst-src --from-file=policyburst/ --dry-run=client -o yaml | kubectl apply -f -
# Experiments instead run the controller as a local process (experiments/run_matrix.py).
apiVersion: apps/v1
kind: Deployment
metadata: { name: policyburst, namespace: kube-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: policyburst } }
  template:
    metadata: { labels: { app: policyburst } }
    spec:
      serviceAccountName: policyburst
      nodeSelector: { p11.burst/destination: private }
      containers:
        - name: controller
          image: python:3.12-slim
          workingDir: /work
          command: ["sh", "-c"]
          args:
            - pip install --quiet kubernetes pyyaml &&
              mkdir -p /work/policyburst && cp /src/*.py /work/policyburst/ &&
              exec python -m policyburst.main --mode "$MODE" --policy "$POLICY" --namespace default
              --state /state/state.json --disable "$DISABLE"
          env:
            - { name: MODE, value: policyburst }
            - { name: POLICY, value: campus-default }
            - { name: DISABLE, value: "" }
          volumeMounts:
            - { name: src, mountPath: /src }
            - { name: state, mountPath: /state }
      volumes:
        - { name: src, configMap: { name: policyburst-src } }
        - { name: state, hostPath: { path: /var/lib/policyburst, type: DirectoryOrCreate } }
